<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Patcher - Inject FPS</title>
  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,system-ui,sans-serif;
      background:#0b1020;
      color:#eef3ff;
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:720px;
      background:#111935;
      border:1px solid #293456;
      border-radius:22px;
      padding:22px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
    }

    p{
      color:#a8b2d1;
      line-height:1.5;
    }

    .drop{
      border:2px dashed #4b5a8a;
      border-radius:18px;
      padding:30px;
      text-align:center;
      margin:18px 0;
      background:#0d1530;
      cursor:pointer;
    }

    input[type=file]{
      display:none;
    }

    input[type=number]{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #43517e;
      background:#080d1d;
      color:white;
      font-size:18px;
    }

    button{
      width:100%;
      padding:15px;
      border:0;
      border-radius:15px;
      background:linear-gradient(135deg,#7c5cff,#00d4ff);
      color:white;
      font-size:17px;
      font-weight:bold;
      margin-top:15px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .box{
      background:#0d1530;
      border:1px solid #293456;
      border-radius:15px;
      padding:14px;
      margin-top:12px;
    }

    .big{
      font-size:22px;
      font-weight:bold;
      word-break:break-word;
    }

    .status{
      white-space:pre-wrap;
      color:#a8b2d1;
      margin-top:12px;
    }

    .ok{
      color:#28e39b;
    }

    .err{
      color:#ff5c7a;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Video Patcher</h1>
    <p>Inject / patch FPS metadata video MP4 tanpa FFmpeg dan tanpa upload server.</p>

    <div id="drop" class="drop">
      <b>Klik untuk pilih video</b><br>
      <span>MP4 / MOV</span>
      <input id="file" type="file" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v">
    </div>

    <div class="box">
      <div>File:</div>
      <div id="name" class="big">—</div>
    </div>

    <div class="box">
      <div>Detected FPS:</div>
      <div id="fps" class="big">—</div>
      <small id="info">Belum ada video</small>
    </div>

    <div class="box">
      <div>Target FPS:</div><br>
      <input id="target" type="number" value="120" min="1" max="1000">
    </div>

    <button id="patch" disabled>Patch Video</button>
    <div id="status" class="status">Siap.</div>
  </div>

  <script>
    const fileInput = document.getElementById("file");
    const drop = document.getElementById("drop");
    const nameEl = document.getElementById("name");
    const fpsEl = document.getElementById("fps");
    const infoEl = document.getElementById("info");
    const target = document.getElementById("target");
    const btn = document.getElementById("patch");
    const statusEl = document.getElementById("status");

    let file = null;
    let buffer = null;
    let parsed = null;

    function status(t, c = ""){
      statusEl.className = "status " + c;
      statusEl.textContent = t;
    }

    function u32(dv, o){
      return dv.getUint32(o, false);
    }

    function w32(dv, o, v){
      dv.setUint32(o, Math.max(1, Math.round(v)), false);
    }

    function typ(dv, o){
      return String.fromCharCode(
        dv.getUint8(o),
        dv.getUint8(o + 1),
        dv.getUint8(o + 2),
        dv.getUint8(o + 3)
      );
    }

    function u64(dv, o){
      return Number(dv.getBigUint64(o, false));
    }

    function w64(dv, o, v){
      dv.setBigUint64(o, BigInt(Math.max(1, Math.round(v))), false);
    }

    function boxes(dv, start, end, path = []){
      let arr = [];
      let o = start;

      while(o + 8 <= end){
        let size = u32(dv, o);
        let type = typ(dv, o + 4);
        let head = 8;

        if(size === 1){
          size = u64(dv, o + 8);
          head = 16;
        }

        if(size === 0){
          size = end - o;
        }

        if(size < 8 || o + size > end){
          break;
        }

        let b = {
          type,
          start:o,
          size,
          head,
          end:o + size,
          path:path.concat(type),
          children:[]
        };

        if(["moov","trak","mdia","minf","stbl","edts","dinf","udta","meta"].includes(type)){
          let cs = o + head + (type === "meta" ? 4 : 0);
          b.children = boxes(dv, cs, o + size, b.path);
        }

        arr.push(b);
        o += size;
      }

      return arr;
    }

    function walk(a, fn){
      for(const b of a){
        fn(b);
        if(b.children){
          walk(b.children, fn);
        }
      }
    }

    function mdhd(dv, b){
      let v = dv.getUint8(b.start + b.head);
      let to;
      let doff;
      let ds;

      if(v === 1){
        to = b.start + b.head + 20;
        doff = b.start + b.head + 24;
        ds = 8;
      }else{
        to = b.start + b.head + 12;
        doff = b.start + b.head + 16;
        ds = 4;
      }

      return {
        timescaleOffset:to,
        durationOffset:doff,
        durationSize:ds,
        timescale:u32(dv, to),
        duration:ds === 8 ? u64(dv, doff) : u32(dv, doff)
      };
    }

    function tkhd(dv, b){
      let v = dv.getUint8(b.start + b.head);
      let doff = v === 1 ? b.start + b.head + 28 : b.start + b.head + 20;
      let ds = v === 1 ? 8 : 4;

      return {
        durationOffset:doff,
        durationSize:ds,
        duration:ds === 8 ? u64(dv, doff) : u32(dv, doff)
      };
    }

    function mvhd(dv, b){
      let v = dv.getUint8(b.start + b.head);
      let to;
      let doff;
      let ds;

      if(v === 1){
        to = b.start + b.head + 20;
        doff = b.start + b.head + 24;
        ds = 8;
      }else{
        to = b.start + b.head + 12;
        doff = b.start + b.head + 16;
        ds = 4;
      }

      return {
        timescaleOffset:to,
        durationOffset:doff,
        durationSize:ds,
        timescale:u32(dv, to),
        duration:ds === 8 ? u64(dv, doff) : u32(dv, doff)
      };
    }

    function isVideo(dv, trak){
      let h = null;

      walk([trak], b => {
        if(b.type === "hdlr"){
          let p = b.start + b.head + 8;
          if(p + 4 <= b.end){
            h = typ(dv, p);
          }
        }
      });

      return h === "vide";
    }

    function stts(dv, b){
      let n = u32(dv, b.start + b.head + 4);
      let o = b.start + b.head + 8;
      let entries = [];

      for(let i = 0; i < n && o + 8 <= b.end; i++, o += 8){
        entries.push({
          countOffset:o,
          deltaOffset:o + 4,
          count:u32(dv, o),
          delta:u32(dv, o + 4)
        });
      }

      return {entries};
    }

    function analyze(buf){
      let dv = new DataView(buf);
      let root = boxes(dv, 0, buf.byteLength);
      let movie = null;
      let tracks = [];

      walk(root, b => {
        if(b.type === "mvhd"){
          movie = mvhd(dv, b);
        }
      });

      for(const moov of root.filter(x => x.type === "moov")){
        for(const trak of moov.children.filter(x => x.type === "trak")){
          if(!isVideo(dv, trak)){
            continue;
          }

          let mb = null;
          let sb = null;
          let tb = null;

          walk([trak], x => {
            if(x.type === "mdhd") mb = x;
            if(x.type === "stts") sb = x;
            if(x.type === "tkhd") tb = x;
          });

          if(mb && sb){
            let m = mdhd(dv, mb);
            let s = stts(dv, sb);
            let t = tb ? tkhd(dv, tb) : null;

            let samples = s.entries.reduce((a, e) => a + e.count, 0);
            let ticks = s.entries.reduce((a, e) => a + e.count * e.delta, 0);
            let sec = ticks / m.timescale;

            tracks.push({
              mdhd:m,
              stts:s,
              tkhd:t,
              samples,
              ticks,
              sec,
              fps:samples / sec
            });
          }
        }
      }

      return {
        movie,
        tracks
      };
    }

    function patch(buf, p, targetFps){
      let out = buf.slice(0);
      let dv = new DataView(out);
      let v = p.tracks[0];

      if(!v){
        throw Error("Track video tidak ditemukan");
      }

      let old = v.fps || 30;
      let ratio = old / targetFps;
      let newTicks = 0;

      for(const e of v.stts.entries){
        let nd = Math.max(1, Math.round(e.delta * ratio));
        w32(dv, e.deltaOffset, nd);
        newTicks += e.count * nd;
      }

      if(v.mdhd.durationSize === 8){
        w64(dv, v.mdhd.durationOffset, newTicks);
      }else{
        w32(dv, v.mdhd.durationOffset, newTicks);
      }

      let newSec = newTicks / v.mdhd.timescale;

      if(v.tkhd && p.movie){
        let d = newSec * p.movie.timescale;

        if(v.tkhd.durationSize === 8){
          w64(dv, v.tkhd.durationOffset, d);
        }else{
          w32(dv, v.tkhd.durationOffset, d);
        }
      }

      if(p.movie){
        let d = newSec * p.movie.timescale;

        if(p.movie.durationSize === 8){
          w64(dv, p.movie.durationOffset, d);
        }else{
          w32(dv, p.movie.durationOffset, d);
        }
      }

      return {
        out,
        old
      };
    }

    async function load(f){
      file = f;
      nameEl.textContent = f.name;
      fpsEl.textContent = "Scanning...";
      status("Membaca file...");

      buffer = await f.arrayBuffer();

      try{
        parsed = analyze(buffer);

        if(!parsed.tracks.length){
          throw Error("Video MP4 tidak cocok");
        }

        let v = parsed.tracks[0];

        fpsEl.textContent = v.fps.toFixed(3);
        infoEl.textContent = `samples ${v.samples} · durasi ${v.sec.toFixed(2)}s`;

        btn.disabled = false;
        status("Siap patch", "ok");

      }catch(e){
        btn.disabled = true;
        status("Error: " + e.message, "err");
      }
    }

    drop.onclick = () => fileInput.click();

    fileInput.onchange = e => {
      if(e.target.files[0]){
        load(e.target.files[0]);
      }
    };

    btn.onclick = () => {
      try{
        let fps = Number(target.value);

        if(!fps){
          throw Error("Target FPS salah");
        }

        let r = patch(buffer, parsed, fps);

        let blob = new Blob([r.out], {
          type:file.type || "video/mp4"
        });

        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = file.name.replace(/\.[^.]+$/, "") + "_patched_" + fps + "fps.mp4";

        document.body.appendChild(a);
        a.click();
        a.remove();

        status("Selesai. File hasil otomatis download.", "ok");

      }catch(e){
        status("Error: " + e.message, "err");
      }
    };
  </script>
</body>
</html>
