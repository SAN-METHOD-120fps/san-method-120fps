<script src="ffmpeg/ffmpeg.min.js"></script>

<script>
function setLang(lang){

const text = document.getElementById("tutorialText");
const enBtn = document.getElementById("enBtn");
const idBtn = document.getElementById("idBtn");

enBtn.classList.remove("active");
idBtn.classList.remove("active");

if(lang === "en"){

text.innerHTML =
'1. Select your video first<br><br>' +
'2. Choose FPS and resolution<br><br>' +
'3. Press "INJECT VIDEO"';

enBtn.classList.add("active");

}else{

text.innerHTML =
'1. Pilih video terlebih dahulu<br><br>' +
'2. Pilih FPS dan resolusi<br><br>' +
'3. Tekan "INJECT VIDEO"';

idBtn.classList.add("active");

}

}

const videoInput = document.getElementById('videoInput');
const fileName = document.getElementById('fileName');
const injectBtn = document.getElementById('injectBtn');
const terminal = document.getElementById('terminalBody');
const downloadBtn = document.getElementById('downloadBtn');

let selectedFile = null;
let selectedVideoInfo = null;
let ffmpeg = null;
let ffmpegLoaded = false;
let currentUrl = null;
let progressTimer = null;

/* =========================
   AUTO UI: OPTION BOX
========================= */

const optionBox = document.createElement('div');
optionBox.id = 'optionBox';
optionBox.style.display = 'none';
optionBox.style.marginBottom = '24px';
optionBox.style.padding = '16px';
optionBox.style.border = '1px solid rgba(0,255,255,.7)';
optionBox.style.borderRadius = '14px';
optionBox.style.background = '#020707';
optionBox.style.textAlign = 'left';

optionBox.innerHTML = `
<label style="display:block;color:#9fffff;font-size:14px;margin-bottom:10px;font-weight:bold;">
Pilih Mode FPS:
</label>

<select id="fpsSelect" style="
width:100%;
padding:13px;
margin-bottom:16px;
border-radius:10px;
background:#000;
color:cyan;
border:1px solid rgba(0,255,255,.5);
font-size:15px;
font-weight:bold;
">
<option value="original">Original FPS</option>
<option value="60">60 FPS</option>
<option value="120">120 FPS</option>
</select>

<label style="display:block;color:#9fffff;font-size:14px;margin-bottom:10px;font-weight:bold;">
Pilih Resolusi:
</label>

<select id="resolutionSelect" style="
width:100%;
padding:13px;
border-radius:10px;
background:#000;
color:cyan;
border:1px solid rgba(0,255,255,.5);
font-size:15px;
font-weight:bold;
">
<option value="original">Original Resolution</option>
</select>

<div id="videoInfoText" style="
margin-top:14px;
color:#19fff4;
font-size:13px;
line-height:1.6;
word-break:break-word;
">
Info video belum tersedia.
</div>
`;

injectBtn.parentNode.insertBefore(optionBox, injectBtn);

const fpsSelect = document.getElementById('fpsSelect');
const resolutionSelect = document.getElementById('resolutionSelect');
const videoInfoText = document.getElementById('videoInfoText');

/* =========================
   AUTO UI: PROGRESS BAR
========================= */

const progressBox = document.createElement('div');
progressBox.id = 'progressBox';
progressBox.style.width = '100%';
progressBox.style.margin = '0 0 24px';
progressBox.style.padding = '14px';
progressBox.style.border = '1px solid rgba(0,255,255,.5)';
progressBox.style.borderRadius = '14px';
progressBox.style.background = '#020707';
progressBox.style.display = 'none';

progressBox.innerHTML = `
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
<span style="color:#9fffff;font-size:13px;font-weight:bold;letter-spacing:1px;">
SAN METHOD PROCESS
</span>
<span id="progressText" style="color:cyan;font-size:14px;font-weight:bold;">
0%
</span>
</div>

<div style="width:100%;height:18px;background:#000;border:1px solid rgba(0,255,255,.4);border-radius:20px;overflow:hidden;">
<div id="progressFill" style="
width:0%;
height:100%;
border-radius:20px;
background:linear-gradient(90deg,#00ffff,#23d3d3,#00aaff);
box-shadow:0 0 18px cyan;
transition:width .25s ease;
"></div>
</div>

<div id="progressStatus" style="
margin-top:10px;
color:#27ff4a;
font-family:'Courier New',monospace;
font-size:13px;
text-align:left;
">
> Menunggu proses inject...
</div>
`;

injectBtn.parentNode.insertBefore(progressBox, injectBtn.nextSibling);

const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const progressStatus = document.getElementById('progressStatus');

/* =========================
   BASIC FUNCTION
========================= */

function log(text){
terminal.textContent += text + '\n';
terminal.scrollTop = terminal.scrollHeight;
}

function clearTerminal(){
terminal.textContent = '';
}

function resetDownload(){

if(currentUrl){
URL.revokeObjectURL(currentUrl);
currentUrl = null;
}

downloadBtn.style.display = 'none';
downloadBtn.removeAttribute('href');
downloadBtn.removeAttribute('download');

}

function setProgress(percent,status){

percent = Math.max(0, Math.min(100, Math.floor(percent)));

progressBox.style.display = 'block';
progressFill.style.width = percent + '%';
progressText.textContent = percent + '%';

if(status){
progressStatus.textContent = '> ' + status;
}

}

function stopProgress(){

if(progressTimer){
clearInterval(progressTimer);
progressTimer = null;
}

}

function resetProgress(){

stopProgress();
progressBox.style.display = 'none';
progressFill.style.width = '0%';
progressText.textContent = '0%';
progressStatus.textContent = '> Menunggu proses inject...';

}

function startProgress(){

stopProgress();

let value = 0;

setProgress(0,'Memulai proses inject...');

progressTimer = setInterval(()=>{

if(value < 15){
value += 2;
setProgress(value,'Menyiapkan video...');
}else if(value < 35){
value += 1;
setProgress(value,'Memuat engine patcher...');
}else if(value < 60){
value += 1;
setProgress(value,'Menganalisis struktur video...');
}else if(value < 88){
value += 1;
setProgress(value,'Menjalankan inject video...');
}else if(value < 95){
value += 1;
setProgress(value,'Finalisasi output...');
}

},250);

}

function finishProgress(status){

stopProgress();
setProgress(100,status || 'Selesai. File otomatis terdownload.');

}

function sleep(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}

/* =========================
   VIDEO INFO
========================= */

function getVideoInfo(file){

return new Promise((resolve,reject)=>{

const video = document.createElement('video');
const url = URL.createObjectURL(file);

video.preload = 'metadata';
video.muted = true;
video.playsInline = true;

video.onloadedmetadata = function(){

const info = {
width: video.videoWidth || 0,
height: video.videoHeight || 0,
duration: video.duration || 0,
size: file.size || 0
};

URL.revokeObjectURL(url);
resolve(info);

};

video.onerror = function(){
URL.revokeObjectURL(url);
reject(new Error('Gagal membaca metadata video.'));
};

video.src = url;

});

}

function formatSize(bytes){

if(!bytes) return '0 MB';

const mb = bytes / 1024 / 1024;
return mb.toFixed(2) + ' MB';

}

function formatDuration(seconds){

if(!seconds || isNaN(seconds)) return '0:00';

const m = Math.floor(seconds / 60);
const s = Math.floor(seconds % 60).toString().padStart(2,'0');

return m + ':' + s;

}

function buildResolutionOptions(info){

resolutionSelect.innerHTML = '';

const originalText = info.width + 'x' + info.height + ' Original';

const original = document.createElement('option');
original.value = 'original';
original.textContent = originalText;
resolutionSelect.appendChild(original);

const isPortrait = info.height >= info.width;

if(isPortrait){

const r1080 = document.createElement('option');
r1080.value = '1080x1920';
r1080.textContent = '1080x1920 HD Portrait';
resolutionSelect.appendChild(r1080);

const r4k = document.createElement('option');
r4k.value = '2160x3840';
r4k.textContent = '2160x3840 4K Portrait';
resolutionSelect.appendChild(r4k);

}else{

const r1080 = document.createElement('option');
r1080.value = '1920x1080';
r1080.textContent = '1920x1080 HD Landscape';
resolutionSelect.appendChild(r1080);

const r4k = document.createElement('option');
r4k.value = '3840x2160';
r4k.textContent = '3840x2160 4K Landscape';
resolutionSelect.appendChild(r4k);

}

}

function getScaleFilter(resolution){

if(resolution === 'original') return null;

const parts = resolution.split('x');

if(parts.length !== 2) return null;

const w = parts[0];
const h = parts[1];

return 'scale=' + w + ':' + h + ':flags=lanczos';

}

function getVideoFilters(){

const fps = fpsSelect.value;
const resolution = resolutionSelect.value;

let filters = [];

if(fps !== 'original'){
filters.push('fps=' + fps);
}

const scale = getScaleFilter(resolution);

if(scale){
filters.push(scale);
}

if(filters.length === 0){
return null;
}

return filters.join(',');

}

/* =========================
   FFMPEG
========================= */

async function loadCore(){

if(ffmpegLoaded) return;

if(!window.FFmpeg){
throw new Error('FFmpeg engine tidak ditemukan.');
}

const { createFFmpeg } = FFmpeg;

const baseURL = window.location.origin + '/ffmpeg';

ffmpeg = createFFmpeg({
log:false,
corePath: baseURL + '/ffmpeg-core.js'
});

await ffmpeg.load();

ffmpegLoaded = true;

}

async function fileExists(name){

try{
ffmpeg.FS('stat', name);
return true;
}catch(e){
return false;
}

}

async function autoDownload(blob){

const url = URL.createObjectURL(blob);
currentUrl = url;

downloadBtn.href = url;
downloadBtn.download = 'san_method.mp4';
downloadBtn.style.display = 'block';

const a = document.createElement('a');
a.href = url;
a.download = 'san_method.mp4';

document.body.appendChild(a);
a.click();
document.body.removeChild(a);

}

async function downloadOutput(){

const exist = await fileExists('output.mp4');

if(!exist){
throw new Error('Output video tidak berhasil dibuat.');
}

const data = ffmpeg.FS('readFile', 'output.mp4');

const blob = new Blob([data.buffer], {
type:'video/mp4'
});

await autoDownload(blob);

}

async function safeDownloadOriginal(){

const blob = new Blob([selectedFile], {
type:'video/mp4'
});

await autoDownload(blob);

}

/* =========================
   EVENT: FILE SELECT
========================= */

videoInput.addEventListener('change', async function(e){

selectedFile = e.target.files[0];

resetDownload();
resetProgress();

if(selectedFile){

fileName.innerHTML = 'File: ' + selectedFile.name;
injectBtn.disabled = false;

clearTerminal();
log('> Video MP4 terdeteksi.');
log('> Membaca informasi video...');

try{

selectedVideoInfo = await getVideoInfo(selectedFile);

buildResolutionOptions(selectedVideoInfo);

optionBox.style.display = 'block';

videoInfoText.innerHTML =
'Resolusi asli: ' + selectedVideoInfo.width + 'x' + selectedVideoInfo.height + '<br>' +
'Durasi: ' + formatDuration(selectedVideoInfo.duration) + '<br>' +
'Ukuran: ' + formatSize(selectedVideoInfo.size);

log('> Resolusi: ' + selectedVideoInfo.width + 'x' + selectedVideoInfo.height);
log('> Durasi: ' + formatDuration(selectedVideoInfo.duration));
log('> Ukuran: ' + formatSize(selectedVideoInfo.size));
log('> Pilih FPS dan resolusi, lalu tekan INJECT VIDEO.');

setProgress(0,'Video siap diproses.');

}catch(err){

optionBox.style.display = 'none';

log('> Gagal membaca info video.');
log('> ' + err.message);
log('> Video tetap bisa diproses mode aman.');

}

}else{

selectedFile = null;
selectedVideoInfo = null;
injectBtn.disabled = true;

optionBox.style.display = 'none';
fileName.innerHTML = 'Belum ada file dipilih.';

clearTerminal();
log('> Pilih video MP4 terlebih dahulu.');

resetProgress();

}

});

/* =========================
   EVENT: INJECT
========================= */

injectBtn.addEventListener('click', async()=>{

if(!selectedFile) return;

injectBtn.disabled = true;
clearTerminal();
resetDownload();
resetProgress();

startProgress();

try{

const selectedFPS = fpsSelect.value;
const selectedResolution = resolutionSelect.value;
const filters = getVideoFilters();

log('> Memulai SAN METHOD injector...');
await sleep(400);

log('> Mode FPS: ' + (selectedFPS === 'original' ? 'Original' : selectedFPS + ' FPS'));
log('> Mode Resolusi: ' + selectedResolution);

log('> Memuat engine patcher...');
await loadCore();

const { fetchFile } = FFmpeg;

try{ ffmpeg.FS('unlink','input.mp4'); }catch(e){}
try{ ffmpeg.FS('unlink','output.mp4'); }catch(e){}

log('> Membaca file MP4...');
ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));

await sleep(400);

if(filters){

log('> Menjalankan real convert...');
log('> Filter: ' + filters);

await ffmpeg.run(
'-y',
'-i','input.mp4',
'-map','0:v:0',
'-map','0:a?',
'-vf', filters,
'-c:v','libx264',
'-preset','veryfast',
'-crf','18',
'-pix_fmt','yuv420p',
'-c:a','aac',
'-b:a','192k',
'-movflags','+faststart',
'-metadata','title=SAN METHOD HD 120FPS',
'-metadata','comment=SAN METHOD VIDEO OPTIMIZER',
'-metadata','encoder=SAN_METHOD_PATCHER',
'output.mp4'
);

}else{

log('> Menjalankan fast inject...');
log('> Mode: remux + faststart + metadata clean.');

await ffmpeg.run(
'-y',
'-i','input.mp4',
'-map','0',
'-c','copy',
'-movflags','+faststart',
'-metadata','title=SAN METHOD HD 120FPS',
'-metadata','comment=SAN METHOD FAST INJECT',
'-metadata','encoder=SAN_METHOD_PATCHER',
'output.mp4'
);

}

log('> Finalisasi output...');
await sleep(500);

await downloadOutput();

finishProgress('Selesai. File otomatis terdownload.');

log('> Inject berhasil.');
log('> Output: san_method.mp4');

}catch(err){

log('> Inject utama gagal.');
log('> ' + err.message);
log('> Membuat file mode aman...');

try{

await safeDownloadOriginal();

finishProgress('Mode aman selesai. File tetap terdownload.');

log('> File aman berhasil dibuat.');
log('> Output: san_method.mp4');

}catch(e){

finishProgress('Gagal membuat file.');

log('> Gagal membuat file.');
log('> ' + e.message);

}

}

injectBtn.disabled = false;

});
</script>
